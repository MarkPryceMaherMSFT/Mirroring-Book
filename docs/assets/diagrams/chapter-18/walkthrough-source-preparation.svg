<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#495057" stroke-width="2"/></marker></defs>
<text x="40" y="60.400000000000006" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#000000">
<tspan x="40" dy="0">PostgreSQL: prepare the server, then verify each database</tspan>
</text>
<text x="40" y="118.4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="40" dy="0">Azure's workflow installs the source-side azure_cdc publisher; the Fabric wizard is a later step.</tspan>
</text>
<rect x="45" y="210" width="330" height="190" rx="16" fill="#dbeafe" stroke="#1864ab" stroke-width="2"/>
<text x="210.0" y="270.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000000">
<tspan x="210.0" dy="0">1 Azure source preparation</tspan>
<tspan x="210.0" dy="26.599999999999998">Enable primary SAMI</tspan>
<tspan x="210.0" dy="26.599999999999998">Select databases + Prepare</tspan>
<tspan x="210.0" dy="26.599999999999998">Approve required restart</tspan>
</text>
<rect x="435" y="210" width="330" height="190" rx="16" fill="#cffafe" stroke="#0c8599" stroke-width="2"/>
<text x="600.0" y="270.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000000">
<tspan x="600.0" dy="0">2 Reconnect and verify</tspan>
<tspan x="600.0" dy="26.599999999999998">wal_level = logical</tspan>
<tspan x="600.0" dy="26.599999999999998">azure_cdc preloaded</tspan>
<tspan x="600.0" dy="26.599999999999998">Worker / slot / sender budget</tspan>
</text>
<rect x="825" y="210" width="330" height="190" rx="16" fill="#dcfce7" stroke="#2f9e44" stroke-width="2"/>
<text x="990.0" y="257.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000000">
<tspan x="990.0" dy="0">3 Each selected database</tspan>
<tspan x="990.0" dy="26.599999999999998">azure_cdc is registered</tspan>
<tspan x="990.0" dy="26.599999999999998">Connection role + table</tspan>
<tspan x="990.0" dy="26.599999999999998">ownership</tspan>
<tspan x="990.0" dy="26.599999999999998">Correct replica identity</tspan>
</text>
<rect x="45" y="460" width="1110" height="230" rx="16" fill="none" stroke="#862e9c" stroke-width="2"/>
<text x="63" y="497.3" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#000000">
<tspan x="63" dy="0">Source-managed publication (after the Fabric mirror is configured)</tspan>
</text>
<rect x="75" y="545" width="380" height="140" rx="16" fill="#dbeafe" stroke="#1864ab" stroke-width="2"/>
<text x="265.0" y="594.1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000000">
<tspan x="265.0" dy="0">Source-side azure_cdc</tspan>
<tspan x="265.0" dy="26.599999999999998">Snapshot + WAL-derived batches</tspan>
<tspan x="265.0" dy="26.599999999999998">Authenticate using primary SAMI</tspan>
</text>
<rect x="800" y="545" width="325" height="140" rx="16" fill="#dcfce7" stroke="#2f9e44" stroke-width="2"/>
<text x="962.5" y="593.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000">
<tspan x="962.5" dy="0">OneLake landing zone</tspan>
<tspan x="962.5" dy="28.0">Snapshot + change Parquet</tspan>
<tspan x="962.5" dy="28.0">files</tspan>
</text>
<polyline points="385,305 425,305" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="775,305 815,305" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="465,615 790,615" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<text x="620.0" y="577.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#000000">
<tspan x="620.0" dy="0">Source publishes</tspan>
</text>
<text x="51" y="760.4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="51" dy="0">Preloading at server startup is not database registration. Do not create a same-named schema or a manual slot to imitate Prepare.</tspan>
</text>
</svg>
