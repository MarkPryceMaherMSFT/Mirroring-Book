<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#495057" stroke-width="2"/></marker></defs>
<text x="40" y="60.400000000000006" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#000000">
<tspan x="40" dy="0">The Python SDK's actual path and its application boundary</tspan>
</text>
<text x="40" y="118.4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="40" dy="0">Pinned SDK b4636ef: a OneLake file helper, not a source connector or crash-safe replication service.</tspan>
</text>
<rect x="40" y="170" width="330" height="210" rx="16" fill="#f3d9fa" stroke="#862e9c" stroke-width="2"/>
<text x="205.0" y="242.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="205.0" dy="0">APPLICATION MUST SUPPLY</tspan>
<tspan x="205.0" dy="25.2">Capture rows + deletes</tspan>
<tspan x="205.0" dy="25.2">Generate / validate Parquet</tspan>
<tspan x="205.0" dy="25.2">Own durable batch journal</tspan>
</text>
<rect x="440" y="170" width="330" height="210" rx="16" fill="#dbeafe" stroke="#1864ab" stroke-width="2"/>
<text x="605.0" y="255.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="605.0" dy="0">create_table()</tspan>
<tspan x="605.0" dy="25.2">Creates folder + key metadata</tspan>
<tspan x="605.0" dy="25.2">No payload-schema validation</tspan>
</text>
<rect x="840" y="170" width="320" height="210" rx="16" fill="#cffafe" stroke="#0c8599" stroke-width="2"/>
<text x="1000.0" y="255.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="1000.0" dy="0">OneLake table folder</tspan>
<tspan x="1000.0" dy="25.2">_metadata.json exists</tspan>
<tspan x="1000.0" dy="25.2">before data publication</tspan>
</text>
<rect x="40" y="470" width="330" height="180" rx="16" fill="#f3d9fa" stroke="#862e9c" stroke-width="2"/>
<text x="205.0" y="540.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="205.0" dy="0">upload_data_file()</tspan>
<tspan x="205.0" dy="25.2">Accepts local file path</tspan>
<tspan x="205.0" dy="25.2">Does not capture CDC</tspan>
</text>
<rect x="440" y="470" width="330" height="180" rx="16" fill="#dbeafe" stroke="#1864ab" stroke-width="2"/>
<text x="605.0" y="540.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="605.0" dy="0">get_next_file_name()</tspan>
<tspan x="605.0" dy="25.2">Lists final Parquet names</tspan>
<tspan x="605.0" dy="25.2">max + 1 is not a reservation</tspan>
</text>
<rect x="840" y="470" width="320" height="180" rx="16" fill="#cffafe" stroke="#0c8599" stroke-width="2"/>
<text x="1000.0" y="540.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="1000.0" dy="0">Read bytes; temp upload</tspan>
<tspan x="1000.0" dy="25.2">Flush; REST rename to final</tspan>
<tspan x="1000.0" dy="25.2">Fabric ingestion is separate</tspan>
</text>
<rect x="150" y="735" width="900" height="120" rx="16" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
<text x="600.0" y="787.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000">
<tspan x="600.0" dy="0">Failure path: rename errors can be printed without raising.</tspan>
<tspan x="600.0" dy="28.0">An upload-method return is not permission to acknowledge a source batch.</tspan>
</text>
