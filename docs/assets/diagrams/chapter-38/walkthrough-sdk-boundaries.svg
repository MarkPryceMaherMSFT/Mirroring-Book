<polyline points="770,275 840,275" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="205,380 205,470" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1000,380 1000,470" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<polyline points="370,560 440,560" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="770,560 840,560" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1000,650 1000,695 600,695 600,735" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
</svg>
