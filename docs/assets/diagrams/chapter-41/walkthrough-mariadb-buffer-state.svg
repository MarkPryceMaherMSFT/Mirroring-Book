<polyline points="755,567 850,567" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<polyline points="1005,655 1005,720" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="41" y="953.6" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#000000">
<tspan x="41" dy="0">Runtime licence boundary: the Toolbox publisher is MIT; MaxScale 24.02 is BSL 1.1 before its version-specific conversion.</tspan>
<tspan x="41" dy="22.4">Compose uses maxscale:latest, so review the actual pinned runtime. Local export does not prove Fabric delivery.</tspan>
</text>
