<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#495057" stroke-width="2"/></marker></defs>
<text x="40" y="60.400000000000006" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#000000">
<tspan x="40" dy="0">Changing a key: delete the old identity, then insert the new one</tspan>
</text>
<text x="40" y="118.4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="40" dy="0">Public row-operation contract: each illustrated row shows key | non-key value | row marker.</tspan>
</text>
<rect x="50" y="160" width="1100" height="125" rx="16" fill="#f3d9fa" stroke="#862e9c" stroke-width="2"/>
<text x="600.0" y="214.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000">
<tspan x="600.0" dy="0">Table key: EmployeeID</tspan>
<tspan x="600.0" dy="28.0">One sequential file: __rowMarker__ is final; apply rows top to bottom</tspan>
</text>
<rect x="45" y="375" width="255" height="165" rx="16" fill="#dbeafe" stroke="#1864ab" stroke-width="2"/>
<text x="172.5" y="449.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000">
<tspan x="172.5" dy="0">Target before</tspan>
<tspan x="172.5" dy="28.0">E0001 -&gt; Bellevue</tspan>
</text>
<rect x="375" y="330" width="470" height="125" rx="16" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
<text x="610.0" y="384.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000">
<tspan x="610.0" dy="0">1. DELETE the old key</tspan>
<tspan x="610.0" dy="28.0">E0001 | NULL | 2</tspan>
</text>
<rect x="375" y="515" width="470" height="125" rx="16" fill="#dcfce7" stroke="#2f9e44" stroke-width="2"/>
<text x="610.0" y="569.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000">
<tspan x="610.0" dy="0">2. INSERT full new row</tspan>
<tspan x="610.0" dy="28.0">E0002 | Bellevue | 0</tspan>
</text>
<rect x="920" y="405" width="235" height="165" rx="16" fill="#cffafe" stroke="#0c8599" stroke-width="2"/>
<text x="1037.5" y="467.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="1037.5" dy="0">Target after</tspan>
<tspan x="1037.5" dy="25.2">E0002 -&gt; Bellevue</tspan>
<tspan x="1037.5" dy="25.2">E0001 absent</tspan>
</text>
<polyline points="300,457 335,457 335,392 375,392" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="610,455 610,515" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<text x="725.0" y="486.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#000000">
<tspan x="725.0" dy="0">then</tspan>
</text>
<polyline points="845,577 885,577 885,487 920,487" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<text x="51" y="727.7" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="51" dy="0">The old key cannot be found by publishing only the new key.</tspan>
<tspan x="51" dy="25.2">For mixed Parquet batches, preserve compatible types and nullable non-key fields.</tspan>
<tspan x="51" dy="25.2">Insert marker 0 does not deduplicate replays; immutable ordered publication still matters.</tspan>
</text>
</svg>
