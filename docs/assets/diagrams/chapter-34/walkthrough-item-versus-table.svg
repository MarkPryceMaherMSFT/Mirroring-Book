<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#495057" stroke-width="2"/></marker></defs>
<text x="40" y="60.400000000000006" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#000000">
<tspan x="40" dy="0">Item definition and table metadata are different contracts</tspan>
</text>
<text x="40" y="118.4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="40" dy="0">Fabric REST lifecycle calls and OneLake file publishers act on the same mirrored item through different planes.</tspan>
</text>
<rect x="30" y="155" width="1140" height="270" rx="16" fill="none" stroke="#1864ab" stroke-width="2"/>
<text x="48" y="192.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000">
<tspan x="48" dy="0">CONTROL PLANE: Fabric REST APIs</tspan>
</text>
<rect x="55" y="220" width="290" height="175" rx="16" fill="#dbeafe" stroke="#1864ab" stroke-width="2"/>
<text x="200.0" y="300.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="200.0" dy="0">Fabric-audience token</tspan>
<tspan x="200.0" dy="25.2">api.fabric.microsoft.com</tspan>
</text>
<rect x="455" y="220" width="290" height="175" rx="16" fill="#dbeafe" stroke="#1864ab" stroke-width="2"/>
<text x="600.0" y="287.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="600.0" dy="0">mirroring.json</tspan>
<tspan x="600.0" dy="25.2">source: GenericMirror</tspan>
<tspan x="600.0" dy="25.2">Item-level definition</tspan>
</text>
<rect x="855" y="220" width="290" height="175" rx="16" fill="#dbeafe" stroke="#1864ab" stroke-width="2"/>
<text x="1000.0" y="287.7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="1000.0" dy="0">Lifecycle + monitoring</tspan>
<tspan x="1000.0" dy="25.2">Create / start / status</tspan>
<tspan x="1000.0" dy="25.2">Follow table-status pages</tspan>
</text>
<rect x="30" y="450" width="1140" height="300" rx="16" fill="none" stroke="#0c8599" stroke-width="2"/>
<text x="48" y="487.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000">
<tspan x="48" dy="0">DATA PLANE: OneLake landing zone</tspan>
</text>
<rect x="55" y="535" width="290" height="170" rx="16" fill="#cffafe" stroke="#0c8599" stroke-width="2"/>
<text x="200.0" y="600.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="200.0" dy="0">Application / publisher</tspan>
<tspan x="200.0" dy="25.2">Capture + valid Parquet</tspan>
<tspan x="200.0" dy="25.2">Own source checkpoints</tspan>
</text>
<rect x="455" y="535" width="290" height="170" rx="16" fill="#cffafe" stroke="#0c8599" stroke-width="2"/>
<text x="600.0" y="600.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="600.0" dy="0">SDK or ADLS client</tspan>
<tspan x="600.0" dy="25.2">Storage-audience token</tspan>
<tspan x="600.0" dy="25.2">Temporary upload + rename</tspan>
</text>
<rect x="855" y="535" width="290" height="170" rx="16" fill="#cffafe" stroke="#0c8599" stroke-width="2"/>
<text x="1000.0" y="600.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="1000.0" dy="0">_metadata.json</tspan>
<tspan x="1000.0" dy="25.2">keyColumns + table options</tspan>
<tspan x="1000.0" dy="25.2">Numbered data files</tspan>
</text>
<polyline points="345,307 455,307" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="745,307 855,307" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="345,620 455,620" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="745,620 855,620" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="600,395 600,450" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="51" y="807.9" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="51" dy="0">These JSON files are not interchangeable. The item definition does not describe the columns in a Parquet file.</tspan>
</text>
</svg>
