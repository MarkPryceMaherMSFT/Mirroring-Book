<text x="41" y="404.8" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#000000">
<tspan x="41" dy="0">Inspected marker ordering needs correction against the public final-column requirement; this figure does not imply it is fixed.</tspan>
</text>
<text x="41" y="962.9" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="41" dy="0">Publication progress is not Fabric ingestion completion. Source extraction and all file renames are not one atomic batch.</tspan>
</text>
