<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#495057" stroke-width="2"/></marker></defs>
<text x="40" y="60.400000000000006" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#000000">
<tspan x="40" dy="0">Azure SQL Database: approve two network directions</tspan>
</text>
<text x="40" y="118.4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="40" dy="0">Gateway access to SQL does not carry the source-managed OneLake publisher.</tspan>
</text>
<rect x="34" y="150" width="1132" height="245" rx="16" fill="none" stroke="#1864ab" stroke-width="2"/>
<text x="52" y="187.3" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#000000">
<tspan x="52" dy="0">1 Fabric connection to the source SQL endpoint</tspan>
</text>
<rect x="60" y="230" width="260" height="125" rx="16" fill="#dbeafe" stroke="#1864ab" stroke-width="2"/>
<text x="190.0" y="271.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000000">
<tspan x="190.0" dy="0">Fabric connection</tspan>
<tspan x="190.0" dy="26.599999999999998">Connection principal</tspan>
<tspan x="190.0" dy="26.599999999999998">Setup + metadata</tspan>
</text>
<rect x="450" y="230" width="300" height="125" rx="16" fill="#cffafe" stroke="#0c8599" stroke-width="2"/>
<text x="600.0" y="271.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000000">
<tspan x="600.0" dy="0">Chosen SQL route</tspan>
<tspan x="600.0" dy="26.599999999999998">Public access: None</tspan>
<tspan x="600.0" dy="26.599999999999998">OR VNet / standard gateway</tspan>
</text>
<rect x="880" y="230" width="260" height="125" rx="16" fill="#dbeafe" stroke="#1864ab" stroke-width="2"/>
<text x="1010.0" y="271.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000000">
<tspan x="1010.0" dy="0">Azure SQL Database</tspan>
<tspan x="1010.0" dy="26.599999999999998">SQL endpoint</tspan>
<tspan x="1010.0" dy="26.599999999999998">Login + database grants</tspan>
</text>
<rect x="34" y="420" width="1132" height="295" rx="16" fill="none" stroke="#862e9c" stroke-width="2"/>
<text x="52" y="457.3" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#000000">
<tspan x="52" dy="0">2 Source publisher to OneLake</tspan>
</text>
<rect x="60" y="515" width="285" height="130" rx="16" fill="#dbeafe" stroke="#1864ab" stroke-width="2"/>
<text x="202.5" y="558.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000">
<tspan x="202.5" dy="0">Azure SQL engine</tspan>
<tspan x="202.5" dy="28.0">Primary SAMI or UAMI</tspan>
<tspan x="202.5" dy="28.0">Snapshot + change feed</tspan>
</text>
<rect x="460" y="515" width="280" height="130" rx="16" fill="#f3d9fa" stroke="#862e9c" stroke-width="2"/>
<text x="600.0" y="558.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000">
<tspan x="600.0" dy="0">OneLake landing zone</tspan>
<tspan x="600.0" dy="28.0">Published snapshot and</tspan>
<tspan x="600.0" dy="28.0">change files</tspan>
</text>
<rect x="885" y="515" width="250" height="130" rx="16" fill="#dcfce7" stroke="#2f9e44" stroke-width="2"/>
<text x="1010.0" y="558.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000">
<tspan x="1010.0" dy="0">Fabric Replicator</tspan>
<tspan x="1010.0" dy="28.0">Apply changes to</tspan>
<tspan x="1010.0" dy="28.0">managed Delta tables</tspan>
</text>
<polyline points="330,292 440,292" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="760,292 870,292" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="355,580 450,580" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<text x="402.5" y="535.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#000000">
<tspan x="402.5" dy="0">Server</tspan>
<tspan x="402.5" dy="22.4">identity</tspan>
</text>
<polyline points="750,580 875,580" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<text x="66" y="379.4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="66" dy="0">Check source DNS/firewall and, if used, the gateway's outbound service connectivity.</tspan>
</text>
<text x="66" y="689.4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="66" dy="0">Restricted OneLake inbound access: allow the logical SQL server resource through Resource Instance Rules.</tspan>
</text>
<text x="40" y="767.9" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="40" dy="0">A source private endpoint and a gateway do not, by themselves, make the outbound publishing path private.</tspan>
</text>
</svg>
