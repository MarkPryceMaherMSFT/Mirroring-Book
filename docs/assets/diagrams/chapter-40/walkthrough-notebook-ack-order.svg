<text x="41" y="395.4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="41" dy="0">Current-state reads are not change streams: add stable keys, all Graph pages, snapshot comparison and durable deleted-key state.</tspan>
</text>
<text x="41" y="912.8" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="41" dy="0">Orange steps move/reset source progress before upload. A crash can leave exported changes undelivered.</tspan>
<tspan x="41" dy="25.2">A hardened publisher journals a bounded set, publishes it, then acknowledges exactly that set.</tspan>
</text>
</svg>
