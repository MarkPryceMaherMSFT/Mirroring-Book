<tspan x="742.5" dy="25.2">STREAM before delivery</tspan>
</text>
<rect x="915" y="695" width="250" height="165" rx="16" fill="#cffafe" stroke="#0c8599" stroke-width="2"/>
<text x="1040.0" y="770.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
