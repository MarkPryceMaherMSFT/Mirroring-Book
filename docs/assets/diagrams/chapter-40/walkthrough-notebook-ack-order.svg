<tspan x="447.5" dy="0">export_cdc_to_parquet</tspan>
<tspan x="447.5" dy="25.2">Select unmoved</tspan>
<tspan x="447.5" dy="25.2">changes</tspan>
<tspan x="447.5" dy="25.2">Write local Parquet</tspan>
</text>
<rect x="620" y="450" width="245" height="165" rx="16" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
<text x="742.5" y="500.1" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="742.5" dy="0">UPDATE ... __moved =</tspan>
<tspan x="742.5" dy="25.2">1</tspan>
<tspan x="742.5" dy="25.2">COMMIT before delivery</tspan>
<tspan x="742.5" dy="25.2">Broad unmoved-row set</tspan>
</text>
