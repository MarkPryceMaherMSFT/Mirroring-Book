<text x="40" y="60.400000000000006" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#000000">
<tspan x="40" dy="0">Notebook capture paths: publication is not source acknowledgement</tspan>
</text>
<text x="40" y="118.4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="40" dy="0">Inspected Toolbox revision b0183fb. Orange steps show progress moved or reset before a later upload.</tspan>
</text>
