<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#495057" stroke-width="2"/></marker></defs>
<text x="40" y="60.400000000000006" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#000000">
<tspan x="40" dy="0">Business Central: connection setup is not table freshness</tspan>
</text>
<text x="40" y="118.4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="40" dy="0">Publisher-controlled checkpoints, not a screen-by-screen wizard. No native Business Central source tile or gateway.</tspan>
</text>
<rect x="40" y="170" width="300" height="210" rx="16" fill="#dbeafe" stroke="#1864ab" stroke-width="2"/>
<text x="190.0" y="255.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="190.0" dy="0">1 Prepare Fabric</tspan>
<tspan x="190.0" dy="25.2">Empty open mirrored database</tspan>
<tspan x="190.0" dy="25.2">Same Entra tenant</tspan>
</text>
<rect x="450" y="170" width="300" height="210" rx="16" fill="#f3d9fa" stroke="#862e9c" stroke-width="2"/>
<text x="600.0" y="242.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="600.0" dy="0">2 Approve source scope</tspan>
<tspan x="600.0" dy="25.2">Enabled companies + persisted</tspan>
<tspan x="600.0" dy="25.2">tables</tspan>
<tspan x="600.0" dy="25.2">All selected fields</tspan>
</text>
<rect x="860" y="170" width="300" height="210" rx="16" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
<text x="1010.0" y="255.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="1010.0" dy="0">3 Connect to Fabric</tspan>
<tspan x="1010.0" dy="25.2">Background connection setup</tspan>
<tspan x="1010.0" dy="25.2">Wait for Setup Complete</tspan>
</text>
<rect x="860" y="465" width="300" height="210" rx="16" fill="#cffafe" stroke="#0c8599" stroke-width="2"/>
<text x="1010.0" y="537.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="1010.0" dy="0">4 Start synchronization</tspan>
<tspan x="1010.0" dy="25.2">Watch source export runs</tspan>
<tspan x="1010.0" dy="25.2">Export Enabled is not run</tspan>
<tspan x="1010.0" dy="25.2">success</tspan>
</text>
<rect x="450" y="465" width="300" height="210" rx="16" fill="#dcfce7" stroke="#2f9e44" stroke-width="2"/>
<text x="600.0" y="537.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="600.0" dy="0">5 Fabric processing</tspan>
<tspan x="600.0" dy="25.2">Snapshot + changes become</tspan>
<tspan x="600.0" dy="25.2">Delta</tspan>
<tspan x="600.0" dy="25.2">SQL visibility is separate</tspan>
</text>
<rect x="40" y="465" width="300" height="210" rx="16" fill="#f1f5f9" stroke="#495057" stroke-width="2"/>
<text x="190.0" y="537.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="190.0" dy="0">6 Accept the result</tspan>
<tspan x="190.0" dy="25.2">Known keys + company</tspan>
<tspan x="190.0" dy="25.2">attribution</tspan>
<tspan x="190.0" dy="25.2">Source changes + reader tests</tspan>
</text>
<polyline points="340,275 450,275" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="750,275 860,275" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1030,380 1030,465" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<text x="940.0" y="426.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#000000">
<tspan x="940.0" dy="0">Finish ≠ start</tspan>
</text>
<polyline points="860,570 750,570" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="450,570 340,570" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<text x="41" y="712.8" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="41" dy="0">Test connection checks API access; Setup Complete checks preparation. Neither proves a current, authorized table. Check source exports,</tspan>
<tspan x="41" dy="25.2">Fabric processing and the actual reader.</tspan>
</text>
</svg>
