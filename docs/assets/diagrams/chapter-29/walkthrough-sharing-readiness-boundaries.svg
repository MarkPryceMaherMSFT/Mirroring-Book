<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#495057" stroke-width="2"/></marker></defs>
<text x="40" y="60.400000000000006" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#000000">
<tspan x="40" dy="0">SAP BDC Connect for Fabric: two sharing directions, two contracts</tspan>
</text>
<text x="40" y="118.4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="40" dy="0">Original readiness model as of 9 November 2026; not a released transport architecture or setup screen.</tspan>
</text>
<rect x="50" y="170" width="300" height="210" rx="16" fill="#dbeafe" stroke="#1864ab" stroke-width="2"/>
<text x="200.0" y="255.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="200.0" dy="0">SAP BDC provider</tspan>
<tspan x="200.0" dy="25.2">Approve product + semantics</tspan>
<tspan x="200.0" dy="25.2">and rights to share</tspan>
</text>
<rect x="450" y="170" width="300" height="210" rx="16" fill="#f1f5f9" stroke="#495057" stroke-width="2"/>
<text x="600.0" y="255.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="600.0" dy="0">Announced sharing</tspan>
<tspan x="600.0" dy="25.2">Fabric-specific transport</tspan>
<tspan x="600.0" dy="25.2">and identity not verified</tspan>
</text>
<rect x="850" y="170" width="300" height="210" rx="16" fill="#dcfce7" stroke="#2f9e44" stroke-width="2"/>
<text x="1000.0" y="255.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="1000.0" dy="0">Fabric / OneLake consumer</tspan>
<tspan x="1000.0" dy="25.2">Approve analytical access</tspan>
<tspan x="1000.0" dy="25.2">and downstream use</tspan>
</text>
<rect x="50" y="450" width="300" height="210" rx="16" fill="#cffafe" stroke="#0c8599" stroke-width="2"/>
<text x="200.0" y="535.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="200.0" dy="0">Fabric / OneLake provider</tspan>
<tspan x="200.0" dy="25.2">Approve data set + owner</tspan>
<tspan x="200.0" dy="25.2">and rights to share</tspan>
</text>
<rect x="450" y="450" width="300" height="210" rx="16" fill="#f1f5f9" stroke="#495057" stroke-width="2"/>
<text x="600.0" y="535.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="600.0" dy="0">Separate sharing contract</tspan>
<tspan x="600.0" dy="25.2">Do not infer writeback,</tspan>
<tspan x="600.0" dy="25.2">CDC or a mirroring wizard</tspan>
</text>
<rect x="850" y="450" width="300" height="210" rx="16" fill="#f3d9fa" stroke="#862e9c" stroke-width="2"/>
<text x="1000.0" y="535.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="1000.0" dy="0">SAP BDC consumer</tspan>
<tspan x="1000.0" dy="25.2">Approve allowed use</tspan>
<tspan x="1000.0" dy="25.2">and consumer permissions</tspan>
</text>
<polyline points="350,275 450,275" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<polyline points="750,275 850,275" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<polyline points="350,555 450,555" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<polyline points="750,555 850,555" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="56" y="418.4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="56" dy="0">Dashed arrows mean announced logical sharing only—not bidirectional transactional synchronization.</tspan>
</text>
<text x="46" y="705.3" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="46" dy="0">Readiness gate: verify release, regions and terms → obtain the vendor's connection specification (including item type and endpoints) →</tspan>
<tspan x="46" dy="25.2">test a non-production share.</tspan>
</text>
</svg>
