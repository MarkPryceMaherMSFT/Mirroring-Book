<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#495057" stroke-width="2"/></marker></defs>
<text x="40" y="60.400000000000006" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#000000">
<tspan x="40" dy="0">Google catalog: federate the identity, then authorize storage</tspan>
</text>
<text x="40" y="118.4" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="40" dy="0">Use the catalog's actual credential mode. Metadata-only mirroring does not make GCS reads implicit.</tspan>
</text>
<rect x="40" y="170" width="320" height="210" rx="16" fill="#f3d9fa" stroke="#862e9c" stroke-width="2"/>
<text x="200.0" y="255.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="200.0" dy="0">1 Microsoft Entra token</tspan>
<tspan x="200.0" dy="25.2">Correct tenant issuer + audience</tspan>
<tspan x="200.0" dy="25.2">Object ID in the oid claim</tspan>
</text>
<rect x="440" y="170" width="320" height="210" rx="16" fill="#dbeafe" stroke="#1864ab" stroke-width="2"/>
<text x="600.0" y="255.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="600.0" dy="0">2 Google OIDC provider</tspan>
<tspan x="600.0" dy="25.2">Trust issuer / audience exactly</tspan>
<tspan x="600.0" dy="25.2">google.subject = assertion.oid</tspan>
</text>
<rect x="840" y="170" width="320" height="210" rx="16" fill="#cffafe" stroke="#0c8599" stroke-width="2"/>
<text x="1000.0" y="242.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="1000.0" dy="0">3 Catalog authorization</tspan>
<tspan x="1000.0" dy="25.2">Federated subject grants:</tspan>
<tspan x="1000.0" dy="25.2">BigLake Viewer</tspan>
<tspan x="1000.0" dy="25.2">Service Usage Consumer</tspan>
</text>
<rect x="50" y="465" width="500" height="210" rx="16" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>
<text x="300.0" y="537.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="300.0" dy="0">A Credential vending</tspan>
<tspan x="300.0" dy="25.2">Catalog-managed service account</tspan>
<tspan x="300.0" dy="25.2">Storage Object User on every bucket</tspan>
<tspan x="300.0" dy="25.2">Federated subject needs no direct bucket grant</tspan>
</text>
<rect x="650" y="465" width="500" height="210" rx="16" fill="#dcfce7" stroke="#2f9e44" stroke-width="2"/>
<text x="900.0" y="537.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="900.0" dy="0">B End-user credentials</tspan>
<tspan x="900.0" dy="25.2">Federated Microsoft Entra principal</tspan>
<tspan x="900.0" dy="25.2">Read access on every associated bucket</tspan>
<tspan x="900.0" dy="25.2">Storage Object Viewer for the reader</tspan>
</text>
<polyline points="360,275 440,275" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="760,275 840,275" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="900,380 900,405 300,405 300,465" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1100,380 1100,425 900,425 900,465" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<text x="41" y="712.8" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000">
<tspan x="41" dy="0">Iceberg files stay in GCS. Public + authenticated endpoints; no BigQuery export, downloaded service-account JSON key or native catalog</tspan>
<tspan x="41" dy="25.2">gateway.</tspan>
</text>
</svg>
